# ---------- drag a tab onto a pane ----------
list.tab.move_here:
  en: Move tab to this pane
  pl: Przenieś kartę na ten panel
list.tab.open_split:
  en: Open alongside, in split view
  pl: Otwórz obok, w podziale widoku

# ---------- what a screen reader reads after a name ----------
list.a11y.new:
  en: "%{name}, new"
  pl: "%{name}, nowy"
list.a11y.online:
  en: ", online-only"
  pl: ", tylko w chmurze"
list.a11y.local:
  en: ", available on this device"
  pl: ", na tym urządzeniu"
list.a11y.pinned:
  en: ", always available on this device"
  pl: ", zawsze na tym urządzeniu"
