# ---------- file operations ----------
ops.queued:
  en: "Queued: starts in %{t}"
  pl: "W kolejce: start za %{t}"
ops.of:
  en: "%{done} of %{total}"
  pl: "%{done} z %{total}"
ops.summary:
  en: "%{size} · %{took} · avg %{speed}"
  pl: "%{size} · %{took} · śr. %{speed}"
ops.done:
  en: "Done: %{title}"
  pl: "Zakończono: %{title}"
ops.finishing:
  en: finishing…
  pl: kończę…
ops.left:
  en: "%{t} left"
  pl: "zostało %{t}"

# ---------- Ctrl+Z ----------
undo.do:
  en: "Undo %{what}"
  pl: "Cofnij %{what}"
undo.done:
  en: "Undone: %{what}"
  pl: "Cofnięto %{what}"
undo.cant:
  en: "Can't undo %{what}"
  pl: "Nie da się cofnąć %{what}"
# what Undo::label names (Polish: accusative after Cofnij)
undo.what.rename:
  en: rename
  pl: zmianę nazwy
undo.what.move:
  en: move
  pl: przeniesienie
undo.what.delete:
  en: delete
  pl: usunięcie
undo.what.copy:
  en: copy
  pl: kopiowanie
undo.what.new_folder:
  en: new folder
  pl: utworzenie folderu
undo.what.bak:
  en: .bak copy
  pl: kopię .bak
# what cannot be taken back (Polish: genitive after "Nie da się cofnąć")
undo.what.copy_taken:
  en: a copy onto names already in use
  pl: kopiowania na zajęte nazwy
undo.what.move_taken:
  en: a move onto names already in use
  pl: przeniesienia na zajęte nazwy
undo.what.move_partial:
  en: a move that stopped half way
  pl: przeniesienia przerwanego w połowie
undo.what.no_bin:
  en: a delete from a drive without a Recycle Bin
  pl: usunięcia z dysku bez Kosza
undo.what.archive:
  en: an archive operation
  pl: operacji na archiwum
undo.note.no_bin:
  en: "Deleted permanently (this drive has no Recycle Bin): this can't be undone"
  pl: "Usunięto na stałe (ten dysk nie ma Kosza): tego nie da się cofnąć"
undo.note.part_no_bin:
  en: "Some items were deleted permanently (drive without a Recycle Bin): Ctrl+Z restores only what is in the Recycle Bin"
  pl: "Część usunięto na stałe (dysk bez Kosza): Ctrl+Z przywróci tylko to, co jest w Koszu"
