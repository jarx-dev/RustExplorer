# Texts of rx-core's own rules (formatting, plurals, undo, operations) and words the whole app shares.
# Each key has `en` and `pl`; a plural key has the forms of each language: en one/other, pl one/few/many.
_version: 2

# ---------- shared ----------
pc.this:
  en: This PC
  pl: Ten komputer
common.cancel:
  en: Cancel
  pl: Anuluj
common.close:
  en: Close
  pl: Zamknij

# ---------- plurals (the word after a number) ----------
drives.one:
  en: drive
  pl: dysk
drives.few:
  pl: dyski
drives.many:
  pl: dysków
drives.other:
  en: drives
folders.one:
  en: folder
  pl: folder
folders.few:
  pl: foldery
folders.many:
  pl: folderów
folders.other:
  en: folders
operations.one:
  en: operation
  pl: operacja
operations.few:
  pl: operacje
operations.many:
  pl: operacji
operations.other:
  en: operations

# ---------- how long ago ----------
ago.now:
  en: just now
  pl: przed chwilą
ago.min:
  en: "%{m} min ago"
  pl: "%{m} min temu"
ago.hr:
  en: "%{h} hr ago"
  pl: "%{h} godz. temu"
ago.hr_min:
  en: "%{h} hr %{m} min ago"
  pl: "%{h} godz. %{m} min temu"

