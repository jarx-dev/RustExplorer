[package]
name = "rx-update"
version = "0.1.0"
edition = "2021"
description = "RustExplorer: self-update from a server on a Tailscale network or HTTPS"
license = "MIT"

[dependencies]
rx-core = { path = "../rx-core" }
chrono = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
