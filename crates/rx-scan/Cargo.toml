[package]
name = "rx-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RustExplorer: a file's verdict from VirusTotal (looked up by its SHA-256, or sent there on request)"

[dependencies]
serde_json = "1"
sha2 = "0.11"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
