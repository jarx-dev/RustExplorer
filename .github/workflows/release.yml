# A release from main, started by hand (Actions → Wydanie → Run workflow): RustExplorer-<build>.exe
# and latest.json, from which released copies update themselves (crates/rx-update). The tag is the
# version the app shows in its menu (v26.1111.1215: year, month and day, hour and minute, Polish
# time). A PR that changes this file runs it without publishing anything.
name: Wydanie

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RUSTEXPLORER_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Wersja z czasu budowania
        id: v
        run: |
          $t = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $pl = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::FromUnixTimeSeconds($t), 'Central European Standard Time')
          $sha = git rev-parse --short HEAD
          "RUSTEXPLORER_BUILT_AT=$t" >> $env:GITHUB_ENV
          "RUSTEXPLORER_BUILD=$sha-$t" >> $env:GITHUB_ENV
          "tag=v$($pl.ToString('yy.MMdd.HHmm'))" >> $env:GITHUB_OUTPUT

      - run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: EXE i latest.json
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $name = "RustExplorer-$env:RUSTEXPLORER_BUILD.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rust-explorer.exe dist/$name
          $exe = Get-Item dist/$name
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $manifest = [ordered]@{
            version  = $version
            build    = $env:RUSTEXPLORER_BUILD
            built_at = [long]$env:RUSTEXPLORER_BUILT_AT
            sha256   = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            url      = $name
            size     = $exe.Length
            notes    = "$(git log -1 --format=%s)"
          }
          # UTF-8 without a BOM: the app parses it with serde_json
          [IO.File]::WriteAllText("$PWD/dist/latest.json", ($manifest | ConvertTo-Json))
          Get-Content dist/latest.json
          "tag: ${{ steps.v.outputs.tag }}"

      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/RustExplorer-*.exe

      - name: Wydanie na GitHubie
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" --target $env:GITHUB_SHA `
            --title "RustExplorer ${{ steps.v.outputs.tag }}" --generate-notes `
            (Get-Item dist/RustExplorer-*.exe).FullName dist/latest.json
