# Every PR and every merge to main: the same Windows build as a release, and the tests
# (most of them need Windows, so this is where they run on every change).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: build i testy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: cargo test --workspace --release --locked --target x86_64-pc-windows-msvc
