# Every PR and every merge to main: the same Windows build as a release, and the tests
# (most of them need Windows, so this is where they run on every change).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only *.md, docs/ or LICENSE changed: the build is skipped, and branch protection counts a
  # skipped job as passed (with no workflow run at all the required check would wait for good).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # what cannot be told (a new branch, a forced push) counts as code
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA") && [ -n "$files" ] && ! grep -qvE '\.md$|^docs/|^LICENSE' <<<"$files"; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: build i testy (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: cargo test --workspace --release --locked --target x86_64-pc-windows-msvc
